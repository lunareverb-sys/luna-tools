# Modelo de configuração do SearXNG para o `buscar`. Copie para searxng-settings.yml e troque a chave:
#   openssl rand -hex 32
use_default_settings: true
general:
  instance_name: "busca-local"
search:
  safe_search: 0
  formats: [html, json]
server:
  bind_address: "127.0.0.1"
  port: 8888
  secret_key: "TROQUE-ESTA-CHAVE"
  limiter: false
  image_proxy: false
  public_instance: false
ui:
  static_use_hash: true
